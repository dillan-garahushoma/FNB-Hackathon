{% extends "base.html" %}
{% block title %}Sign in — Path2Work{% endblock %}
{% block content %}
  <section class="signin-page">
    <div class="signin-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in to Path2Work</h1>
      <p class="form-intro">Pick up where you left off.</p>
      <form class="account-form" action="{{ url_for('sign_in') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required value="{{ email|default('') }}">
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required data-password-input>
            <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="button button-primary button-submit" type="submit">Sign in</button>
      </form>
      <p class="signin-signup">New to Path2Work? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
  </section>
{% endblock %}
{% block footer %}
  <footer class="auth-footer"><a href="{{ url_for('home') }}">Back to Path2Work</a></footer>
{% endblock %}
