{# Component: Demo Account Button/Card #}
<div class="rounded-xl border border-slate-200 bg-white p-4 hover:border-build/50 transition-all">
    <div class="flex items-start justify-between gap-2">
        <div>
            <div class="font-display font-bold text-sm text-ink">{{ name }}</div>
            <div class="text-xs text-slate-500">{{ org }}</div>
        </div>
        {% if role == 'candidate' %}
            <span class="inline-flex items-center gap-1 rounded bg-prove-soft px-2 py-0.5 text-[11px] font-bold text-prove-dark border border-prove/20">
                Level {{ trust_level }} · {{ score }} pts
            </span>
        {% else %}
            <span class="inline-flex items-center gap-1 rounded bg-match-soft px-2 py-0.5 text-[11px] font-bold text-match-dark border border-match/20">
                Employer Reviewer
            </span>
        {% endif %}
    </div>
    <div class="mt-3 flex items-center justify-between text-xs text-slate-600 border-t border-slate-100 pt-2.5">
        <span class="font-mono text-[11px] text-slate-500 truncate select-all">{{ email }}</span>
        <button type="button" 
                onclick="document.getElementById('email').value='{{ email }}'; document.getElementById('password').value='demo1234'; document.getElementById('login-form') ? document.getElementById('login-form').submit() : (window.location.href='{{ url_for('auth.login') }}');"
                class="font-semibold text-build-dark hover:underline text-xs">
            Quick fill &rarr;
        </button>
    </div>
</div>
